<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07051a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ninja" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Ninja</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud">
        <button id="btn-menu" class="hud-btn" aria-label="Main menu" title="Main menu (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h4.5v-5h3v5H18V9.5" /></svg>
        </button>
        <a id="btn-edit" class="hud-btn" href="editor/" aria-label="Back to the level editor" title="Back to the level editor" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4" /></svg>
        </a>
        <button id="btn-restart" class="hud-btn" aria-label="Restart level" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" /><path d="M5 4v5h5" /></svg>
        </button>
        <button id="btn-debug" class="hud-btn" aria-label="Toggle physics overlay" title="Physics overlay (`)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 11v6M12 7.5v.5" /></svg>
        </button>
        <button id="btn-fullscreen" class="hud-btn" aria-label="Toggle fullscreen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
      </div>

      <div id="timer" role="timer" aria-label="Time left" hidden>
        <span id="level-label" aria-label="Level" hidden></span>
        <div id="timer-track"><div id="timer-fill"></div></div>
        <span id="timer-text">0.0</span>
      </div>

      <div id="stats">
        <div id="key-indicator" aria-label="Key not collected yet" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4" /><path d="M11 12h10M18 12v4M15 12v3" /></svg>
        </div>
        <div id="gold-counter" aria-label="Gold collected">
          <span class="gold-icon" aria-hidden="true"></span><span id="gold-count">0</span>
        </div>
      </div>

      <div id="message" hidden></div>

      <div id="rotate-hint">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="14" width="36" height="20" rx="3" /><path d="M30 8a14 14 0 0 1 12 12M30 8l3-2M30 8l2 3" /></svg>
        <p>Turn your device upright to play</p>
      </div>
    </div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
