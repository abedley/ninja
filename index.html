<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#a9aab3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ninja" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>Ninja</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="hud">
        <button id="btn-restart" class="hud-btn" aria-label="Restart level" title="Restart (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7" /><path d="M5 4v5h5" /></svg>
        </button>
        <button id="btn-debug" class="hud-btn" aria-label="Toggle physics overlay" title="Physics overlay (`)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 11v6M12 7.5v.5" /></svg>
        </button>
        <button id="btn-fullscreen" class="hud-btn" aria-label="Toggle fullscreen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
      </div>

      <div id="touch-controls" aria-hidden="true">
        <div class="pad" id="pad-left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></div>
        <div class="pad" id="pad-right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></div>
        <div class="pad" id="pad-jump"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" /></svg></div>
      </div>

      <div id="message" hidden></div>

      <div id="rotate-hint">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="6" width="20" height="36" rx="3" /><path d="M40 30a14 14 0 0 1-12 12M40 30l-3 2M40 30l2 3" /></svg>
        <p>Rotate your device to play</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
